name: Price error alerts
 
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a test message to Telegram instead of checking deals"
        type: boolean
        default: false
 
permissions:
  contents: write
 
concurrency:
  group: price-alerts
  cancel-in-progress: false
 
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Send a test message
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_alerts.py --test
 
      - name: Check deal feeds
        if: ${{ !inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_alerts.py
 
      - name: Save what has been seen
        if: ${{ !inputs.test_telegram }}
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "price-alerts-bot"
            git config user.email price-alerts-bot@users.noreply.github.com
            git add seen.json
            git commit -m "Update seen deals"
            git push
          fi
